<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>游戏资料库</title>
    <meta name="description" content="本地使用的游戏资料库。">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Game TimeLine</p>
        <h1>游戏时间线</h1>
      </div>
      <label class="timeline-artwork-debug" for="timelineArtworkDebug">
        <input id="timelineArtworkDebug" type="checkbox">
        <span>显示图片区域</span>
      </label>
    </header>

    <main class="app-shell">
      <section class="content">
        <nav class="library-tabs" aria-label="资料库页面" role="tablist">
          <button class="library-tab active" type="button" role="tab" aria-selected="true" aria-controls="console-library-panel" data-library-tab="console-library-panel">游戏主机</button>
          <button class="library-tab" type="button" role="tab" aria-selected="false" aria-controls="series-library-panel" data-library-tab="series-library-panel">游戏系列</button>
        </nav>

        <section id="console-library-panel" class="library-tab-panel" role="tabpanel">
          <section class="insight-panel">
            <div>
              <p class="eyebrow"> Game Console Timeline</p>
              <h2>游戏主机时间线</h2>
            </div>
          </section>

          <div id="timeline" class="timeline" aria-label="主机年份时间线"></div>
          <div id="resultsMeta" class="results-meta"></div>
          <div id="platformGrid" class="platform-grid"></div>
        </section>

        <section id="series-library-panel" class="library-tab-panel" role="tabpanel" hidden>
          <nav class="series-tabs" aria-label="游戏系列资料库页面" role="tablist">
            <button class="series-tab active" type="button" role="tab" aria-selected="true" aria-controls="series-overview-panel" data-series-tab="series-overview-panel">总览</button>
            <button class="series-tab" type="button" role="tab" aria-selected="false" aria-controls="pokemon-library-panel" data-series-tab="pokemon-library-panel">Pokémon</button>
            <button class="series-tab" type="button" role="tab" aria-selected="false" aria-controls="final-fantasy-library-panel" data-series-tab="final-fantasy-library-panel">Final Fantasy</button>
          </nav>

          <section id="series-overview-panel" class="series-tab-panel" role="tabpanel"></section>
          <section id="pokemon-library-panel" class="series-tab-panel" role="tabpanel" hidden>
            <div id="pokemonTimeline" class="pokemon-timeline" aria-label="Pokemon核心系列时间线"></div>
          </section>
          <section id="final-fantasy-library-panel" class="series-tab-panel" role="tabpanel" hidden>
            <div id="finalFantasyTimeline" class="final-fantasy-timeline" aria-label="Final Fantasy 游戏时间线"></div>
          </section>
        </section>

        <section id="image-manager-panel" class="library-tab-panel image-manager-panel" role="tabpanel" hidden>
          <div id="imageManager" aria-label="时间线图片管理"></div>
        </section>
      </section>
    </main>

    <template id="platformTemplate">
      <article class="platform-card">
        <figure class="platform-media">
          <div class="image-placeholder" aria-hidden="true">
            <div class="device-mark"></div>
          </div>
          <div class="image-stack"></div>
          <img class="image-prototype" alt="" loading="lazy">
          <figcaption></figcaption>
        </figure>
        <div class="card-head">
          <div>
            <p class="platform-year"></p>
            <h3></h3>
            <p class="platform-brand"></p>
          </div>
        </div>
        <p class="platform-notes"></p>
        <div class="tag-row"></div>
        <details class="variant-details">
          <summary></summary>
          <div class="variant-list"></div>
        </details>
        <details class="game-details">
          <summary></summary>
          <div class="game-groups"></div>
        </details>
      </article>
    </template>

    <script src="data.js"></script>
    <script src="images.js"></script>
    <script src="image-sources.js"></script>
    <script src="release-dates.js"></script>
    <script src="platform-variants.js"></script>
    <script src="curated-games.js"></script>
    <script src="game-localizations.js"></script>
    <script src="pokemon-releases.js"></script>
    <script src="final-fantasy-releases.js"></script>
    <script src="final-fantasy-covers.js"></script>
    <script src="final-fantasy-logos.js"></script>
    <script src="timeline-image-overrides.js"></script>
    <script src="timeline-image-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
